<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F9FF"/>
    </linearGradient>
    <linearGradient id="blueHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadowCotton" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0284C7" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Soft Aura -->
  <circle cx="200" cy="150" r="120" fill="#F0F9FF"/>
  <circle cx="200" cy="150" r="90" fill="#E0F2FE" opacity="0.6"/>

  <g filter="url(#shadowCotton)">
    <!-- Cotton Balls Bag Pouch Body -->
    <rect x="110" y="65" width="150" height="175" rx="18" fill="url(#pouchGrad)" stroke="#BAE6FD" stroke-width="2"/>
    
    <!-- Top Blue Wave Header -->
    <path d="M 110 85 Q 110 65 128 65 L 242 65 Q 260 65 260 85 L 260 110 C 240 100 220 115 185 105 C 150 95 130 110 110 100 Z" fill="url(#blueHeader)"/>
    
    <!-- Zipper line -->
    <line x1="120" y1="75" x2="250" y2="75" stroke="#E0F2FE" stroke-width="1.5" stroke-dasharray="3 2"/>

    <!-- Brand Name -->
    <text x="185" y="140" fill="#0369A1" font-family="system-ui, sans-serif" font-weight="900" font-size="19" text-anchor="middle" font-style="italic">Caressa</text>
    <text x="185" y="158" fill="#0C4A6E" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" text-anchor="middle" letter-spacing="1.5">COTTON BALLS</text>
    <text x="185" y="172" fill="#64748B" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">100% Pure Natural Cotton • Ekstra Lembut</text>

    <!-- Translucent window showing fluffy cotton balls -->
    <rect x="130" y="185" width="110" height="42" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Cotton puff balls in window -->
    <circle cx="150" cy="206" r="13" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.5"/>
    <circle cx="170" cy="202" r="14" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.5"/>
    <circle cx="190" cy="207" r="13" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.5"/>
    <circle cx="210" cy="203" r="14" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.5"/>
    <circle cx="225" cy="208" r="11" fill="#FFFFFF" stroke="#E0F2FE" stroke-width="1.5"/>

    <!-- Fluffy Cotton Balls sitting outside the bag -->
    <g transform="translate(230, 190)">
      <circle cx="25" cy="30" r="18" fill="white" stroke="#BAE6FD" stroke-width="2"/>
      <circle cx="45" cy="25" r="16" fill="white" stroke="#BAE6FD" stroke-width="2"/>
      <circle cx="35" cy="15" r="14" fill="white" stroke="#BAE6FD" stroke-width="2"/>
    </g>
  </g>

  <!-- Natural Badge -->
  <g transform="translate(70, 48)">
    <rect x="0" y="0" width="125" height="28" rx="14" fill="#0284C7"/>
    <text x="62.5" y="18" fill="white" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">☁️ 100% KAPAS MURNI</text>
  </g>
</svg>
