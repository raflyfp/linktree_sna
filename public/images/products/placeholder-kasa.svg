<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4C1D95" flood-opacity="0.1"/>
    </filter>
  </defs>

  <circle cx="200" cy="150" r="120" fill="#F5F3FF"/>
  <circle cx="200" cy="150" r="90" fill="#EDE9FE" opacity="0.4"/>

  <g filter="url(#shadow3)">
    <rect x="110" y="70" width="180" height="150" rx="16" fill="white" stroke="#EDE9FE" stroke-width="2"/>
    <rect x="110" y="70" width="180" height="36" rx="16" fill="#EDE9FE"/>
    <text x="200" y="94" fill="#6D28D9" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">PC CARE COLLECTION</text>

    <!-- Gauze Swab Illustration -->
    <rect x="150" y="125" width="100" height="70" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="150" y1="145" x2="250" y2="145" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="150" y1="165" x2="250" y2="165" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="180" y1="125" x2="180" y2="195" stroke="#E2E8F0" stroke-width="1"/>
    <line x1="220" y1="125" x2="220" y2="195" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- Placeholder Badge -->
  <g transform="translate(130, 220)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#E2E8F0"/>
    <text x="70" y="16" fill="#475569" font-family="system-ui, sans-serif" font-weight="600" font-size="10" text-anchor="middle">ITEM PLACEHOLDER</text>
  </g>
</svg>
