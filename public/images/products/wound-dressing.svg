<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0FDF4"/>
    </linearGradient>
    <linearGradient id="greenHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="shadowHospak" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#15803D" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Soft Aura -->
  <circle cx="200" cy="150" r="120" fill="#F0FDF4"/>
  <circle cx="200" cy="150" r="90" fill="#DCFCE7" opacity="0.6"/>

  <g filter="url(#shadowHospak)">
    <!-- Box Body -->
    <rect x="100" y="70" width="160" height="150" rx="16" fill="url(#boxGrad)" stroke="#BBF7D0" stroke-width="2"/>
    
    <!-- Top Green Stripe Header -->
    <path d="M 100 86 Q 100 70 116 70 L 244 70 Q 260 70 260 86 L 260 102 L 100 102 Z" fill="url(#greenHeader)"/>
    <text x="180" y="90" fill="white" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" text-anchor="middle" letter-spacing="1">HOS-PAK</text>

    <!-- Subtitle & Brand -->
    <text x="180" y="130" fill="#14532D" font-family="system-ui, sans-serif" font-weight="900" font-size="14" text-anchor="middle">WOUND DRESSING</text>
    <text x="180" y="148" fill="#16A34A" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" text-anchor="middle">Bantalan Luka Steril Anti-Lengket</text>
    <text x="180" y="162" fill="#6B7280" font-family="system-ui, sans-serif" font-size="7.5" text-anchor="middle">Absorbent &amp; Breathable Pad</text>

    <!-- Cross Symbol -->
    <rect x="175" y="174" width="10" height="30" rx="2" fill="#22C55E"/>
    <rect x="165" y="184" width="30" height="10" rx="2" fill="#22C55E"/>

    <!-- Gauze / Dressing Pad in front -->
    <g transform="translate(225, 120)">
      <rect x="0" y="15" width="85" height="85" rx="10" fill="white" stroke="#86EFAC" stroke-width="2"/>
      <!-- Inner soft absorbent pad -->
      <rect x="15" y="30" width="55" height="55" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="42.5" y="60" fill="#15803D" font-family="system-ui, sans-serif" font-weight="bold" font-size="7" text-anchor="middle">STERILE</text>
    </g>
  </g>

  <!-- Hospital Standard Badge -->
  <g transform="translate(65, 48)">
    <rect x="0" y="0" width="135" height="28" rx="14" fill="#15803D"/>
    <text x="67.5" y="18" fill="white" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">🏥 STANDAR MEDIS</text>
  </g>
</svg>
