<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#4C1D95" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Soft Aura -->
  <circle cx="200" cy="150" r="120" fill="#F5F3FF"/>
  <circle cx="200" cy="150" r="90" fill="#EDE9FE" opacity="0.6"/>

  <!-- Product Box Group -->
  <g filter="url(#shadow)">
    <!-- Main Box Body -->
    <rect x="90" y="70" width="160" height="150" rx="16" fill="white" stroke="#EDE9FE" stroke-width="2"/>
    
    <!-- Top Accent Bar -->
    <path d="M 90 86 Q 90 70 106 70 L 234 70 Q 250 70 250 86 L 250 105 L 90 105 Z" fill="url(#purpleGrad)"/>
    <text x="170" y="93" fill="white" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" text-anchor="middle" letter-spacing="1">POLIFIX</text>

    <!-- Cross Icon / Medical Symbol -->
    <rect x="162" y="125" width="16" height="40" rx="3" fill="#6D28D9"/>
    <rect x="150" y="137" width="40" height="16" rx="3" fill="#6D28D9"/>
    
    <text x="170" y="185" fill="#4C1D95" font-family="system-ui, sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Non-Woven Fixation Tape</text>
    <text x="170" y="202" fill="#6B7280" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Hypoallergenic &amp; Breathable</text>

    <!-- Adhesive Roll in Front -->
    <g transform="translate(200, 120)">
      <!-- Roll outer -->
      <ellipse cx="60" cy="70" rx="45" ry="40" fill="url(#boxGrad)" stroke="#8B5CF6" stroke-width="3"/>
      <!-- Roll hole -->
      <ellipse cx="60" cy="70" rx="20" ry="18" fill="white" stroke="#C4B5FD" stroke-width="2"/>
      <!-- Tape peel -->
      <path d="M 60 110 C 30 110 0 115 -20 125 L -20 105 C 0 95 30 90 60 90 Z" fill="#DDD6FE" stroke="#8B5CF6" stroke-width="1.5"/>
      <path d="M -15 118 L 10 102" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="2 2"/>
    </g>
  </g>

  <!-- "Kemasan Baru" Ribbon Badge -->
  <g transform="translate(65, 50)">
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#22C55E"/>
    <text x="65" y="18" fill="white" font-family="system-ui, sans-serif" font-weight="bold" font-size="11" text-anchor="middle">✨ KEMASAN BARU</text>
  </g>
</svg>
